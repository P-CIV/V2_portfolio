services:
  - type: web
    name: portfolio-chatbot-server
    runtime: python
    runtimeVersion: 3.11
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        scope: run
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
